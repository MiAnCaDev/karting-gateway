<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Servicio apagado</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔌</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #e9edf2;
      --panel: #f6f8fb;
      --ink: #172033;
      --muted: #55627a;
      --line: #cfd7e3;
      --led: #f59e0b;
      --link: #1d5fd1;
      --shadow: 0 1px 0 #fff inset, 0 24px 48px -24px rgba(23,32,51,.35);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161f;
        --panel: #1a2130;
        --ink: #eef2f8;
        --muted: #9aa7bd;
        --line: #2b354a;
        --link: #7db4ff;
        --shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 24px 48px -24px rgba(0,0,0,.7);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background:
        radial-gradient(60rem 30rem at 50% -10%, color-mix(in srgb, var(--led) 10%, transparent), transparent 70%),
        var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
    }
    main {
      width: 100%;
      max-width: 30rem;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1.75rem;
      padding: 3rem 2rem 2.25rem;
      box-shadow: var(--shadow);
      text-align: center;
    }

    /* Botón de encendido con LED en espera: lo único que se mueve */
    .power {
      position: relative;
      width: 6.5rem;
      height: 6.5rem;
      margin: 0 auto 2rem;
      border-radius: 2rem;
      display: grid;
      place-items: center;
      background: linear-gradient(160deg, var(--panel), var(--bg));
      border: 1px solid var(--line);
      box-shadow: 0 1px 0 #fff3 inset, 0 10px 20px -10px rgba(23,32,51,.4);
      color: var(--muted);
    }
    .power svg { width: 2.8rem; height: 2.8rem; }
    .led {
      position: absolute;
      top: .8rem;
      right: .8rem;
      width: .6rem;
      height: .6rem;
      border-radius: 50%;
      background: var(--led);
      box-shadow: 0 0 0 0 color-mix(in srgb, var(--led) 70%, transparent);
      animation: standby 2.8s ease-in-out infinite;
    }
    @keyframes standby {
      0%, 100% { opacity: .45; box-shadow: 0 0 0 0 transparent; }
      50% { opacity: 1; box-shadow: 0 0 14px 4px color-mix(in srgb, var(--led) 60%, transparent); }
    }

    h1 {
      margin: 0 0 .75rem;
      font-size: clamp(1.75rem, 6vw, 2.25rem);
      font-weight: 800;
      line-height: 1.1;
      letter-spacing: -.02em;
    }
    p { margin: 0 auto .5rem; max-width: 34ch; color: var(--muted); }
    .status {
      color: var(--ink);
      font-weight: 600;
    }

    .contact {
      margin-top: 2rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
    }
    .contact p { margin-bottom: 1rem; font-size: .95rem; }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
      justify-content: center;
    }
    .links a {
      display: inline-flex;
      align-items: center;
      gap: .45rem;
      padding: .6rem 1.1rem;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--link);
      font-weight: 600;
      font-size: .95rem;
      text-decoration: none;
      transition: border-color .15s, transform .15s;
    }
    .links a:hover { border-color: var(--link); }
    .links a:active { transform: translateY(1px); }
    .links a:focus-visible { outline: 3px solid var(--link); outline-offset: 2px; }
    .links svg { width: 1.05rem; height: 1.05rem; flex: none; }

    @media (prefers-reduced-motion: reduce) {
      .led { animation: none; opacity: 1; box-shadow: 0 0 10px 2px color-mix(in srgb, var(--led) 50%, transparent); }
      .links a { transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <div class="power" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v8"/>
        <path d="M6.3 6.8a8 8 0 1 0 11.4 0"/>
      </svg>
      <span class="led"></span>
    </div>

    <h1>Servicio apagado</h1>
    <p>Esta web no está disponible en este momento.</p>
    <p class="status">Se trata de una parada programada.</p>

    <section class="contact">
      <p>¿Necesitas algo? Contacta con el administrador:</p>
      <div class="links">
        <a href="https://miguelandrescaballero.es">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
          miguelandrescaballero.es
        </a>
        <a href="https://t.me/TwiBlog_bot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 4 3 11l6 2 2 6 3-4 4 3z"/></svg>
          Telegram
        </a>
      </div>
    </section>
  </main>
</body>
</html>
