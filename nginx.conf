# DNS interno de Docker, resuelto en cada petición:
# nginx arranca aunque los contenedores destino estén parados.
resolver 127.0.0.11 valid=5s ipv6=off;

# ---------- 8080 -> karts-frontend-1 ----------
server {
    listen 8080;

    location / {
        set $upstream http://karts-frontend-1:80;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 3s;
        proxy_intercept_errors on;
        error_page 502 503 504 =503 /apagado.html;
    }

    location = /apagado.html {
        root /usr/share/nginx/html;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After 300 always;
    }
}

# ---------- 8090 -> karting-live-web-1 ----------
